# Server cleanup policy
# Configuration for Hetzner bare-metal Linux server

[general]
name = "server"
min_age_hours = 2.0
trash_retention_days = 7
backup_retention_count = 3
backup_retention_days = 14
max_plan_files = 500
max_plan_bytes = 2147483648  # 2 GB

[roots]
allowed = ["/opt/voice-agent", "."]

[protected]
exact = [
    "voice_platform.db",
    "voice_platform.db-wal",
    "voice_platform.db-shm",
    "data/voice_platform.db",
    "data/voice_platform.db-wal",
    "data/voice_platform.db-shm",
    "AGENTS.md",
    "AGENT.md"
]
prefixes = [
    ".git/",
    ".env",
    "app/",
    "frontend/src/",
    "scripts/",
    "services/",
    "policies/",
    "docs/",
    "models/streaming-stt/"
]
patterns = [
    "*.pem",
    "*.key",
    "*.cert",
    "*secret*",
    "*credential*"
]

[rules.category_a]
name = "Regenerable caches"
action = "delete"
patterns = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "cache/gallery/**"
]

[rules.category_c]
name = "Debug dumps and audio"
action = "quarantine"
min_age_hours = 2.0
patterns = [
    "data/debug/**",
    "data/tmp/**"
]

[rules.category_d]
name = "Engine temp files and partials"
action = "quarantine"
min_age_hours = 2.0
patterns = [
    "backends/*.partial",
    "backends/*.tmp",
    "backends/*.download",
    "models/**/*.partial",
    "models/**/*.tmp",
    "models/**/*.download"
]

[rules.category_e]
name = "Old database backups"
action = "quarantine"
min_age_hours = 336.0 # 14 days
patterns = [
    "data/backups/*.db"
]

[rules.category_f]
name = "Rotated logs"
action = "quarantine"
min_age_hours = 336.0 # 14 days
patterns = [
    "logs/*.log.*",
    "logs/*-*.log"
]

[rules.category_h]
name = "Deployment staging"
action = "delete"
patterns = [
    "/tmp/voice-agent/**",
    "/tmp/fe/**"
]
