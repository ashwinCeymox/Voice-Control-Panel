version: "3.8"

services:
  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-voice-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    volumes:
      - voice_data:/app/data
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  voice_data:
